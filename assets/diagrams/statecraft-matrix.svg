<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
<title id="title">Statecraft matrix pillar relationships</title>
<desc id="desc">Six statecraft pillars form a network where legitimacy, money, society, security, law, and digital infrastructure reinforce and constrain each other.</desc>
<rect width="1280" height="860" fill="#151620"/>
<text x="80" y="90" class="eyebrow">STATECRAFT MATRIX</text><text x="80" y="136" class="title">Six Pillars as One System</text>
<g stroke="#464b66" stroke-width="3" fill="none">
<line x1="640" y1="210" x2="940" y2="340"/><line x1="940" y1="340" x2="890" y2="650"/><line x1="890" y1="650" x2="390" y2="650"/><line x1="390" y1="650" x2="340" y2="340"/><line x1="340" y1="340" x2="640" y2="210"/><line x1="640" y1="210" x2="640" y2="715"/><line x1="340" y1="340" x2="890" y2="650"/><line x1="940" y1="340" x2="390" y2="650"/><line x1="340" y1="340" x2="940" y2="340"/><line x1="390" y1="650" x2="640" y2="210"/><line x1="890" y1="650" x2="640" y2="210"/></g>
<g class="node"><circle cx="640" cy="210" r="92"/><text x="640" y="196">1. Legitimacy</text><text x="640" y="224" class="sub">Social Software</text></g>
<g class="node"><circle cx="940" cy="340" r="92"/><text x="940" y="326">2. Money</text><text x="940" y="354" class="sub">Trust Engine</text></g>
<g class="node"><circle cx="890" cy="650" r="92"/><text x="890" y="636">3. Society</text><text x="890" y="664" class="sub">Spatial Architecture</text></g>
<g class="node"><circle cx="390" cy="650" r="92"/><text x="390" y="636">4. Security</text><text x="390" y="664" class="sub">Paradox of Shield</text></g>
<g class="node"><circle cx="340" cy="340" r="92"/><text x="340" y="326">5. Law</text><text x="340" y="354" class="sub">Sovereign Club</text></g>
<g class="node"><circle cx="640" cy="715" r="92"/><text x="640" y="701">6. Digital</text><text x="640" y="729" class="sub">Cloud Registry</text></g>
<text x="80" y="800" class="caption">A founder cannot optimize one pillar in isolation; each intervention changes the load on the whole system.</text>
<style>.title{font:700 38px ui-sans-serif,system-ui;fill:#f4f4f7}.eyebrow{font:700 13px ui-sans-serif,system-ui;letter-spacing:2.5px;fill:#8b7cff}.node circle{fill:#20222e;stroke:#6f63ff;stroke-width:3}.node text{font:700 19px ui-sans-serif,system-ui;fill:#fff;text-anchor:middle}.node .sub{font:15px ui-sans-serif,system-ui;fill:#b9bbd0}.caption{font:18px ui-sans-serif,system-ui;fill:#c6c7d7}</style></svg>
