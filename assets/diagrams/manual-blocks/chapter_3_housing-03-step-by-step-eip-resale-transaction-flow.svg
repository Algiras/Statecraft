<svg xmlns="http://www.w3.org/2000/svg" width="900" height="502" viewBox="0 0 900 502" role="img" aria-labelledby="title desc">
  <title id="title">[Step by Step EIP Resale Transaction Flow]</title>
  <desc id="desc">Manual figure generated from a source block in the Statecraft manuscript.</desc>
  <rect width="900" height="502" rx="14" fill="#171821"/>
  <rect x="1" y="1" width="898" height="500" rx="13" fill="none" stroke="#32354a"/>
  <text x="32" y="30" class="label">STATECRAFT MANUAL FIGURE</text>
  <text x="32" y="54" class="line">[Step-by-Step EIP Resale Transaction Flow]</text>
  <text x="32" y="76" class="line"></text>
  <text x="32" y="98" class="line">  ┌──────────────────────────────────────────────────────────┐</text>
  <text x="32" y="120" class="line">  │ 1. Seller lists property on HDB Resale Portal            │</text>
  <text x="32" y="142" class="line">  └─────────────────────────────┬────────────────────────────┘</text>
  <text x="32" y="164" class="line">                                │</text>
  <text x="32" y="186" class="line">                                ▼</text>
  <text x="32" y="208" class="line">  ┌──────────────────────────────────────────────────────────┐</text>
  <text x="32" y="230" class="line">  │ 2. Portal automatically checks Block &amp; Neighborhood caps  │</text>
  <text x="32" y="252" class="line">  └─────────────────────────────┬────────────────────────────┘</text>
  <text x="32" y="274" class="line">                                │</text>
  <text x="32" y="296" class="line">            ┌───────────────────┴───────────────────┐</text>
  <text x="32" y="318" class="line">            │                                       │</text>
  <text x="32" y="340" class="line">            ▼ (Below Quota)                         ▼ (At/Above Quota)</text>
  <text x="32" y="362" class="line">  ┌───────────────────────────┐           ┌───────────────────────────┐</text>
  <text x="32" y="384" class="line">  │ Transaction Approved      │           │ Purchase Restricted       │</text>
  <text x="32" y="406" class="line">  │ Open to all buyers        │           │ Only open to under-       │</text>
  <text x="32" y="428" class="line">  └───────────────────────────┘           │ represented groups        │</text>
  <text x="32" y="450" class="line">                                          └───────────────────────────┘</text>
  <style>.label{font:700 12px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:2px;fill:#8b7cff}.line{font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#d8d9ea}</style>
</svg>
