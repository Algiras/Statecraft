<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1918" viewBox="0 0 1200 1918" role="img" aria-labelledby="title desc">
  <title id="title"> ] STEP 1: CONSTITUTIONAL DE-ESCALATION</title>
  <desc id="desc">Clean Statecraft figure rendered from manual source material.</desc>
  <rect width="1200" height="1918" rx="18" fill="#151620"/>
  <rect x="1" y="1" width="1198" height="1916" rx="17" fill="none" stroke="#34384f"/>
  <text x="48" y="42" class="eyebrow">STATECRAFT MANUAL FIGURE</text>
  <text x="48" y="78" class="heading"> ] STEP 1: CONSTITUTIONAL DE-ESCALATION</text>
  <rect x="48" y="112" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="146" class="body">[ ] STEP 1: CONSTITUTIONAL DE-ESCALATION</text>
  <path d="M600 174 v8" class="arrow"/>
  <rect x="48" y="186" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="220" class="body">Implement an absolute constitutional ban on the creation and maintenance of a</text>
  <path d="M600 248 v8" class="arrow"/>
  <rect x="48" y="260" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="294" class="body">standing military.</text>
  <path d="M600 322 v8" class="arrow"/>
  <rect x="48" y="334" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="368" class="body">*Action:* Draft a clause similar to Article 12 of the Costa Rican Constitution:</text>
  <path d="M600 396 v8" class="arrow"/>
  <rect x="48" y="408" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="442" class="body">&quot;The army as a permanent institution is proscribed. For the watch and preservation</text>
  <path d="M600 470 v8" class="arrow"/>
  <rect x="48" y="482" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="516" class="body">of public order, there shall be the necessary police forces.&quot;</text>
  <path d="M600 544 v8" class="arrow"/>
  <rect x="48" y="556" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="590" class="body">[ ] STEP 2: LAW ENFORCEMENT BIFURCATION</text>
  <path d="M600 618 v8" class="arrow"/>
  <rect x="48" y="630" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="664" class="body">Separate domestic police, border patrol, and intelligence services into distinct</text>
  <path d="M600 692 v8" class="arrow"/>
  <rect x="48" y="704" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="738" class="body">civilian agencies. Do not allow them to share command structures, heavy weaponry,</text>
  <path d="M600 766 v8" class="arrow"/>
  <rect x="48" y="778" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="812" class="body">or military doctrines.</text>
  <path d="M600 840 v8" class="arrow"/>
  <rect x="48" y="852" width="1104" height="76" rx="14" class="card"/>
  <text x="74" y="886" class="body">*Rationale:* A militarized police force is simply a Praetorian army by another</text>
  <text x="74" y="909" class="body">name.</text>
  <path d="M600 932 v8" class="arrow"/>
  <rect x="48" y="944" width="1104" height="76" rx="14" class="card"/>
  <text x="74" y="978" class="body">Keep domestic police under the Ministry of Government, and border/coast guards</text>
  <text x="74" y="1001" class="body">under</text>
  <path d="M600 1024 v8" class="arrow"/>
  <rect x="48" y="1036" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="1070" class="body">the Ministry of Public Security.</text>
  <path d="M600 1098 v8" class="arrow"/>
  <rect x="48" y="1110" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="1144" class="body">[ ] STEP 3: REGIONAL TREATY ARBITRAGE</text>
  <path d="M600 1172 v8" class="arrow"/>
  <rect x="48" y="1184" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="1218" class="body">Before formalizing disarmament, secure membership in a robust mutual defense pact</text>
  <path d="M600 1246 v8" class="arrow"/>
  <rect x="48" y="1258" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="1292" class="body">(e.g., Rio Treaty, NATO, or a bilateral defense treaty with a regional hegemon).</text>
  <path d="M600 1320 v8" class="arrow"/>
  <rect x="48" y="1332" width="1104" height="76" rx="14" class="card"/>
  <text x="74" y="1366" class="body">*Action:* Ensure the treaty contains a clear &quot;an attack on one is an attack on</text>
  <text x="74" y="1389" class="body">all&quot;</text>
  <path d="M600 1412 v8" class="arrow"/>
  <rect x="48" y="1424" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="1458" class="body">clause and that your state is recognized as a neutral, disarmed member.</text>
  <path d="M600 1486 v8" class="arrow"/>
  <rect x="48" y="1498" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="1532" class="body">[ ] STEP 4: DIVIDEND RING-FENCING</text>
  <path d="M600 1560 v8" class="arrow"/>
  <rect x="48" y="1572" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="1606" class="body">Pass organic laws that legally bind the savings from the defense budget directly</text>
  <path d="M600 1634 v8" class="arrow"/>
  <rect x="48" y="1646" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="1680" class="body">to human capital trust funds.</text>
  <path d="M600 1708 v8" class="arrow"/>
  <rect x="48" y="1720" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="1754" class="body">*Warning:* If the savings are absorbed into general administrative expenses, they</text>
  <path d="M600 1782 v8" class="arrow"/>
  <rect x="48" y="1794" width="1104" height="76" rx="14" class="card"/>
  <text x="74" y="1828" class="body">will be captured by bureaucratic corruption, destroying the social cohesion</text>
  <text x="74" y="1851" class="body">dividend.</text>
  <style>
    .eyebrow{font:700 12px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:2.4px;fill:#8b7cff}.heading{font:700 28px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f6f6fb}.card{fill:#20222e;stroke:#3a3e55}.body{font:18px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#dfe1f1}.arrow{stroke:#8b7cff;stroke-width:3;marker-end:url(#arrow)}
  </style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto"><path d="M1,1 L5,9 L9,1" fill="none" stroke="#8b7cff" stroke-width="2"/></marker></defs>
</svg>
