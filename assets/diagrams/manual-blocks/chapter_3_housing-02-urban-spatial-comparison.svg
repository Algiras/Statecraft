<svg xmlns="http://www.w3.org/2000/svg" width="900" height="414" viewBox="0 0 900 414" role="img" aria-labelledby="title desc">
  <title id="title">[Urban Spatial Comparison]</title>
  <desc id="desc">Manual figure generated from a source block in the Statecraft manuscript.</desc>
  <rect width="900" height="414" rx="14" fill="#171821"/>
  <rect x="1" y="1" width="898" height="412" rx="13" fill="none" stroke="#32354a"/>
  <text x="32" y="30" class="label">STATECRAFT MANUAL FIGURE</text>
  <text x="32" y="54" class="line">[Urban Spatial Comparison]</text>
  <text x="32" y="76" class="line"></text>
  <text x="32" y="98" class="line">Singapore (HDB/EIP):</text>
  <text x="32" y="120" class="line">┌─────────────────────────────────────────────────────────┐</text>
  <text x="32" y="142" class="line">│ Integrated High-Rises (Corridors, Void Decks, Hawker)   │</text>
  <text x="32" y="164" class="line">└─────────────────────────────────────────────────────────┘</text>
  <text x="32" y="186" class="line">  * Demographic Caps: Enforced mixing</text>
  <text x="32" y="208" class="line">  * Public Spaces: Designed for passive contact</text>
  <text x="32" y="230" class="line"></text>
  <text x="32" y="252" class="line">Paris (Banlieues):</text>
  <text x="32" y="274" class="line">┌─────────────────────────────────────────────────────────┐</text>
  <text x="32" y="296" class="line">│ Isolated Grands Ensembles (Cut off by Périphérique)    │</text>
  <text x="32" y="318" class="line">└─────────────────────────────────────────────────────────┘</text>
  <text x="32" y="340" class="line">  * Color-blind Policy: De facto enclaves</text>
  <text x="32" y="362" class="line">  * Public Spaces: Disconnected, high unemployment zones</text>
  <style>.label{font:700 12px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:2px;fill:#8b7cff}.line{font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#d8d9ea}</style>
</svg>
