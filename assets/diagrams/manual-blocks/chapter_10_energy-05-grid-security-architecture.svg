<svg xmlns="http://www.w3.org/2000/svg" width="900" height="414" viewBox="0 0 900 414" role="img" aria-labelledby="title desc">
  <title id="title">GRID SECURITY ARCHITECTURE</title>
  <desc id="desc">Manual figure generated from a source block in the Statecraft manuscript.</desc>
  <rect width="900" height="414" rx="14" fill="#171821"/>
  <rect x="1" y="1" width="898" height="412" rx="13" fill="none" stroke="#32354a"/>
  <text x="32" y="30" class="label">STATECRAFT MANUAL FIGURE</text>
  <text x="32" y="54" class="line">                     GRID SECURITY ARCHITECTURE</text>
  <text x="32" y="76" class="line">    </text>
  <text x="32" y="98" class="line">             [ LEVEL 1: CYBER PHYSICAL AIR-GAPPING ]</text>
  <text x="32" y="120" class="line">             - Complete isolation of SCADA networks.</text>
  <text x="32" y="142" class="line">             - Physical unidirectional data diodes.</text>
  <text x="32" y="164" class="line">                                |</text>
  <text x="32" y="186" class="line">                                v</text>
  <text x="32" y="208" class="line">             [ LEVEL 2: PHYSICAL DEFENSE-IN-DEPTH ]</text>
  <text x="32" y="230" class="line">             - Triple-layered perimeter fences with sensors.</text>
  <text x="32" y="252" class="line">             - Hardened control rooms resistant to EMP.</text>
  <text x="32" y="274" class="line">                                |</text>
  <text x="32" y="296" class="line">                                v</text>
  <text x="32" y="318" class="line">             [ LEVEL 3: DECENTRALIZED ISLANDING ]</text>
  <text x="32" y="340" class="line">             - Microgrid switching to isolate local areas.</text>
  <text x="32" y="362" class="line">             - Local generation capacity matching local load.</text>
  <style>.label{font:700 12px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:2px;fill:#8b7cff}.line{font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#d8d9ea}</style>
</svg>
