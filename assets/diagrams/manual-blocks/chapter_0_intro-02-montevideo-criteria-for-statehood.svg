<svg xmlns="http://www.w3.org/2000/svg" width="900" height="414" viewBox="0 0 900 414" role="img" aria-labelledby="title desc">
  <title id="title">MONTEVIDEO CRITERIA FOR STATEHOOD</title>
  <desc id="desc">Manual figure generated from a source block in the Statecraft manuscript.</desc>
  <rect width="900" height="414" rx="14" fill="#171821"/>
  <rect x="1" y="1" width="898" height="412" rx="13" fill="none" stroke="#32354a"/>
  <text x="32" y="30" class="label">STATECRAFT MANUAL FIGURE</text>
  <text x="32" y="54" class="line">+-----------------------------------------------------------------+</text>
  <text x="32" y="76" class="line">|               MONTEVIDEO CRITERIA FOR STATEHOOD                 |</text>
  <text x="32" y="98" class="line">+------------------------------------+----------------------------+</text>
  <text x="32" y="120" class="line">| 1. Permanent Population            | 2. Defined Territory       |</text>
  <text x="32" y="142" class="line">|    - Numerical size irrelevant     |    - Borders may be        |</text>
  <text x="32" y="164" class="line">|    - Must exhibit community life   |      disputed or narrow    |</text>
  <text x="32" y="186" class="line">|    - Virtual/online presence       |    - Must be a natural     |</text>
  <text x="32" y="208" class="line">|      does not qualify              |      portion of the earth  |</text>
  <text x="32" y="230" class="line">+------------------------------------+----------------------------+</text>
  <text x="32" y="252" class="line">| 3. Government                      | 4. Capacity for Relations  |</text>
  <text x="32" y="274" class="line">|    - Must exercise effective administrative | - Ability to enter into  |</text>
  <text x="32" y="296" class="line">|      control over territory and population   |   treaties and relations |</text>
  <text x="32" y="318" class="line">|    - Monopoly on physical force    | - Requires recognition   |</text>
  <text x="32" y="340" class="line">|      (Weberian criterion)          |   by existing states     |</text>
  <text x="32" y="362" class="line">+------------------------------------+----------------------------+</text>
  <style>.label{font:700 12px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:2px;fill:#8b7cff}.line{font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#d8d9ea}</style>
</svg>
