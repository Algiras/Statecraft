<svg xmlns="http://www.w3.org/2000/svg" width="900" height="414" viewBox="0 0 900 414" role="img" aria-labelledby="title desc">
  <title id="title">THE STATE OPERATING SYSTEM</title>
  <desc id="desc">Manual figure generated from a source block in the Statecraft manuscript.</desc>
  <rect width="900" height="414" rx="14" fill="#171821"/>
  <rect x="1" y="1" width="898" height="412" rx="13" fill="none" stroke="#32354a"/>
  <text x="32" y="30" class="label">STATECRAFT MANUAL FIGURE</text>
  <text x="32" y="54" class="line">+---------------------------------------------------------+</text>
  <text x="32" y="76" class="line">|                  THE STATE OPERATING SYSTEM             |</text>
  <text x="32" y="98" class="line">+---------------------------------------------------------+</text>
  <text x="32" y="120" class="line">|  [Hardware Layer]                                       |</text>
  <text x="32" y="142" class="line">|  - Territory, Borders, Police, Currency, Infrastructure  |</text>
  <text x="32" y="164" class="line">+---------------------------------------------------------+</text>
  <text x="32" y="186" class="line">|  [Software Layer: Installed via School System]          |</text>
  <text x="32" y="208" class="line">|  - Language Standardization (Shared Communication Protocol)|</text>
  <text x="32" y="230" class="line">|  - National Mythos (Shared History &amp; Group Identity)     |</text>
  <text x="32" y="252" class="line">|  - Civic Norms (Voluntary Compliance &amp; Punctuality)     |</text>
  <text x="32" y="274" class="line">|  - Cognitive Alignment (Shared Value Framework)         |</text>
  <text x="32" y="296" class="line">+---------------------------------------------------------+</text>
  <text x="32" y="318" class="line">|  [User Layer: The Citizens]                             |</text>
  <text x="32" y="340" class="line">|  - Uniform execution of state functions and civic duties|</text>
  <text x="32" y="362" class="line">+---------------------------------------------------------+</text>
  <style>.label{font:700 12px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:2px;fill:#8b7cff}.line{font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#d8d9ea}</style>
</svg>
