<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1328" viewBox="0 0 1200 1328" role="img" aria-labelledby="title desc">
  <title id="title">THE SOVEREIGN STATE</title>
  <desc id="desc">Clean Statecraft figure rendered from manual source material.</desc>
  <rect width="1200" height="1328" rx="18" fill="#151620"/>
  <rect x="1" y="1" width="1198" height="1326" rx="17" fill="none" stroke="#34384f"/>
  <text x="48" y="42" class="eyebrow">STATECRAFT MANUAL FIGURE</text>
  <text x="48" y="78" class="heading">THE SOVEREIGN STATE</text>
  <rect x="48" y="112" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="146" class="body">THE SOVEREIGN STATE</text>
  <path d="M600 174 v8" class="arrow"/>
  <rect x="48" y="186" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="220" class="body">(No fiscal printing authority; must balance budget or</text>
  <path d="M600 248 v8" class="arrow"/>
  <rect x="48" y="260" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="294" class="body">borrow at market rates from commercial lenders)</text>
  <path d="M600 322 v8" class="arrow"/>
  <rect x="48" y="334" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="368" class="body">(No Credit / No Deficit Financing)</text>
  <path d="M600 396 v8" class="arrow"/>
  <rect x="48" y="408" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="442" class="body">THE CURRENCY BOARD SYSTEM</text>
  <path d="M600 470 v8" class="arrow"/>
  <rect x="48" y="482" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="516" class="body">ISSUE DEPARTMENT BANKING DEPARTMENT</text>
  <path d="M600 544 v8" class="arrow"/>
  <rect x="48" y="556" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="590" class="body">Holds 100% Backing (Optional)</text>
  <path d="M600 618 v8" class="arrow"/>
  <rect x="48" y="630" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="664" class="body">in foreign reserve Clearing &amp; settlement</text>
  <path d="M600 692 v8" class="arrow"/>
  <rect x="48" y="704" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="738" class="body">assets (Gold/DEM/EUR) services for banks.</text>
  <path d="M600 766 v8" class="arrow"/>
  <rect x="48" y="778" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="812" class="body">No lender-of-last-</text>
  <path d="M600 840 v8" class="arrow"/>
  <rect x="48" y="852" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="886" class="body">Prints domestic notes resort capability.</text>
  <path d="M600 914 v8" class="arrow"/>
  <rect x="48" y="926" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="960" class="body">only upon receipt of</text>
  <path d="M600 988 v8" class="arrow"/>
  <rect x="48" y="1000" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="1034" class="body">anchor reserves.</text>
  <path d="M600 1062 v8" class="arrow"/>
  <rect x="48" y="1074" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="1108" class="body">(100% Legal Peg: e.g., 8 EEK = 1 DEM)</text>
  <path d="M600 1136 v8" class="arrow"/>
  <rect x="48" y="1148" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="1182" class="body">THE REAL ECONOMY</text>
  <path d="M600 1210 v8" class="arrow"/>
  <rect x="48" y="1222" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="1256" class="body">(Unlimited exchange: Domestic Notes &lt; &gt; Foreign Reserves)</text>
  <style>
    .eyebrow{font:700 12px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:2.4px;fill:#8b7cff}.heading{font:700 28px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f6f6fb}.card{fill:#20222e;stroke:#3a3e55}.body{font:18px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#dfe1f1}.arrow{stroke:#8b7cff;stroke-width:3;marker-end:url(#arrow)}
  </style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto"><path d="M1,1 L5,9 L9,1" fill="none" stroke="#8b7cff" stroke-width="2"/></marker></defs>
</svg>
