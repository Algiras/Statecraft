<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="662" viewBox="0 0 1200 662" role="img" aria-labelledby="title desc">
  <title id="title">TYPICAL BALANCE SHEET: ISSUE DEPARTMENT</title>
  <desc id="desc">Clean Statecraft figure rendered from manual source material.</desc>
  <rect width="1200" height="662" rx="18" fill="#151620"/>
  <rect x="1" y="1" width="1198" height="660" rx="17" fill="none" stroke="#34384f"/>
  <text x="48" y="42" class="eyebrow">STATECRAFT MANUAL FIGURE</text>
  <text x="48" y="78" class="heading">TYPICAL BALANCE SHEET: ISSUE DEPARTMENT</text>
  <rect x="48" y="112" width="1104" height="58" rx="14" class="card"/>
  <text x="74" y="146" class="body">TYPICAL BALANCE SHEET: ISSUE DEPARTMENT</text>
  <path d="M600 174 v8" class="arrow"/>
