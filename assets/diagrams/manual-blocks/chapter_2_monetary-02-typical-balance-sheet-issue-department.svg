<svg xmlns="http://www.w3.org/2000/svg" width="900" height="348" viewBox="0 0 900 348" role="img" aria-labelledby="title desc">
  <title id="title">TYPICAL BALANCE SHEET: ISSUE DEPARTMENT</title>
  <desc id="desc">Manual figure generated from a source block in the Statecraft manuscript.</desc>
  <rect width="900" height="348" rx="14" fill="#171821"/>
  <rect x="1" y="1" width="898" height="346" rx="13" fill="none" stroke="#32354a"/>
  <text x="32" y="30" class="label">STATECRAFT MANUAL FIGURE</text>
  <text x="32" y="54" class="line">   TYPICAL BALANCE SHEET: ISSUE DEPARTMENT</text>
  <text x="32" y="76" class="line">   ┌─────────────────────────────────────┬─────────────────────────────────────┐</text>
  <text x="32" y="98" class="line">   │ ASSETS                              │ LIABILITIES                         │</text>
  <text x="32" y="120" class="line">   ├─────────────────────────────────────┼─────────────────────────────────────┤</text>
  <text x="32" y="142" class="line">   │ 1. Gold Reserves (Valued at market) │ 1. Banknotes in circulation         │</text>
  <text x="32" y="164" class="line">   │ 2. Anchor Currency Cash Deposits    │ 2. Coins in circulation             │</text>
  <text x="32" y="186" class="line">   │ 3. Anchor Government Bonds (Liquid) │ 3. Commercial Bank clearing deposits│</text>
  <text x="32" y="208" class="line">   ├─────────────────────────────────────┼─────────────────────────────────────┤</text>
  <text x="32" y="230" class="line">   │ TOTAL ASSETS (e.g., $110M)          │ TOTAL LIABILITIES (e.g., $100M)     │</text>
  <text x="32" y="252" class="line">   ├─────────────────────────────────────┴─────────────────────────────────────┤</text>
  <text x="32" y="274" class="line">   │ NET SURPLUS (RESERVE RATIO: 110%)                                         │</text>
  <text x="32" y="296" class="line">   └───────────────────────────────────────────────────────────────────────────┘</text>
  <style>.label{font:700 12px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:2px;fill:#8b7cff}.line{font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#d8d9ea}</style>
</svg>
