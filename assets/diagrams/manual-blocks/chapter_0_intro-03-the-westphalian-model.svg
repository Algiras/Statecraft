<svg xmlns="http://www.w3.org/2000/svg" width="900" height="458" viewBox="0 0 900 458" role="img" aria-labelledby="title desc">
  <title id="title">THE WESTPHALIAN MODEL</title>
  <desc id="desc">Manual figure generated from a source block in the Statecraft manuscript.</desc>
  <rect width="900" height="458" rx="14" fill="#171821"/>
  <rect x="1" y="1" width="898" height="456" rx="13" fill="none" stroke="#32354a"/>
  <text x="32" y="30" class="label">STATECRAFT MANUAL FIGURE</text>
  <text x="32" y="54" class="line">                   THE WESTPHALIAN MODEL</text>
  <text x="32" y="76" class="line">                   </text>
  <text x="32" y="98" class="line">     +-----------------------------------------------+</text>
  <text x="32" y="120" class="line">     |              SOVEREIGN EQUALITY               |</text>
  <text x="32" y="142" class="line">     |  - All states are legally equal under law    |</text>
  <text x="32" y="164" class="line">     +-----------------------+-----------------------+</text>
  <text x="32" y="186" class="line">                             |</text>
  <text x="32" y="208" class="line">     +-----------------------v-----------------------+</text>
  <text x="32" y="230" class="line">     |             TERRITORIAL INTEGRITY             |</text>
  <text x="32" y="252" class="line">     |  - State has exclusive authority over land    |</text>
  <text x="32" y="274" class="line">     +-----------------------+-----------------------+</text>
  <text x="32" y="296" class="line">                             |</text>
  <text x="32" y="318" class="line">     +-----------------------v-----------------------+</text>
  <text x="32" y="340" class="line">     |               NON-INTERVENTION                |</text>
  <text x="32" y="362" class="line">     |  - External powers cannot interfere in internal |</text>
  <text x="32" y="384" class="line">     |    affairs of a sovereign state               |</text>
  <text x="32" y="406" class="line">     +-----------------------------------------------+</text>
  <style>.label{font:700 12px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:2px;fill:#8b7cff}.line{font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#d8d9ea}</style>
</svg>
