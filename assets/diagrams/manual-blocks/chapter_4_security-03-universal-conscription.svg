<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
  <title id="title">UNIVERSAL CONSCRIPTION</title>
  <desc id="desc">Manual figure generated from a source block in the Statecraft manuscript.</desc>
  <rect width="900" height="480" rx="14" fill="#171821"/>
  <rect x="1" y="1" width="898" height="478" rx="13" fill="none" stroke="#32354a"/>
  <text x="32" y="30" class="label">STATECRAFT MANUAL FIGURE</text>
  <text x="32" y="54" class="line">                     +---------------------------------------+</text>
  <text x="32" y="76" class="line">                     |          UNIVERSAL CONSCRIPTION       |</text>
  <text x="32" y="98" class="line">                     +---------------------------------------+</text>
  <text x="32" y="120" class="line">                                         |</text>
  <text x="32" y="142" class="line">                                         v</text>
  <text x="32" y="164" class="line">                     +---------------------------------------+</text>
  <text x="32" y="186" class="line">                     |    CIVIL-MILITARY BLENDING PROTOCOL   |</text>
  <text x="32" y="208" class="line">                     +---------------------------------------+</text>
  <text x="32" y="230" class="line">                                         |</text>
  <text x="32" y="252" class="line">             +---------------------------+---------------------------+</text>
  <text x="32" y="274" class="line">             |                                                       |</text>
  <text x="32" y="296" class="line">             v                                                       v</text>
  <text x="32" y="318" class="line">+---------------------------------------+               +---------------------------------------+</text>
  <text x="32" y="340" class="line">|        CITIZEN-SOLDIER MATRIX         |               |          TOTAL DEFENSE SYSTEMS        |</text>
  <text x="32" y="362" class="line">| - Weapons stored at citizen residences|               | - Roadways serve as emergency runways |</text>
  <text x="32" y="384" class="line">| - Military rank tied to civilian job  |               | - Structural bunkers in all buildings |</text>
  <text x="32" y="406" class="line">| - Annual training cycles (3-4 weeks)  |               | - Food and fuel stockpiles (2-year)   |</text>
  <text x="32" y="428" class="line">+---------------------------------------+               +---------------------------------------+</text>
  <style>.label{font:700 12px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:2px;fill:#8b7cff}.line{font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#d8d9ea}</style>
</svg>
