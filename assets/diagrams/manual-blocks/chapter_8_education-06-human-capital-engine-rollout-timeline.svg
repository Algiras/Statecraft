<svg xmlns="http://www.w3.org/2000/svg" width="900" height="414" viewBox="0 0 900 414" role="img" aria-labelledby="title desc">
  <title id="title">HUMAN CAPITAL ENGINE ROLLOUT TIMELINE</title>
  <desc id="desc">Manual figure generated from a source block in the Statecraft manuscript.</desc>
  <rect width="900" height="414" rx="14" fill="#171821"/>
  <rect x="1" y="1" width="898" height="412" rx="13" fill="none" stroke="#32354a"/>
  <text x="32" y="30" class="label">STATECRAFT MANUAL FIGURE</text>
  <text x="32" y="54" class="line">+-----------------------------------------------------------------+</text>
  <text x="32" y="76" class="line">|               HUMAN CAPITAL ENGINE ROLLOUT TIMELINE             |</text>
  <text x="32" y="98" class="line">+-----------------------------------------------------------------+</text>
  <text x="32" y="120" class="line">| Phase 1: Competency Deconstruction (Months 1–12)                 |</text>
  <text x="32" y="142" class="line">| - Abolish traditional subjects. Create 5 core competency fields. |</text>
  <text x="32" y="164" class="line">| - Deploy state e-School Identity Registry.                     |</text>
  <text x="32" y="186" class="line">+-----------------------------------------------------------------+</text>
  <text x="32" y="208" class="line">| Phase 2: Teacher Academy &amp; Clinical Residency (Months 13–24)    |</text>
  <text x="32" y="230" class="line">| - Transition teacher training to Clinical Residency model.      |</text>
  <text x="32" y="252" class="line">| - Launch micro-credentialing certification framework.           |</text>
  <text x="32" y="274" class="line">+-----------------------------------------------------------------+</text>
  <text x="32" y="296" class="line">| Phase 3: Lifelong Learning Incentives (Months 25+)              |</text>
  <text x="32" y="318" class="line">| - Initialize Individual Learning Accounts (ILA) for citizens.   |</text>
  <text x="32" y="340" class="line">| - Launch State Skills Credit System and Corporate Tax Credits.  |</text>
  <text x="32" y="362" class="line">+-----------------------------------------------------------------+</text>
  <style>.label{font:700 12px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:2px;fill:#8b7cff}.line{font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#d8d9ea}</style>
</svg>
