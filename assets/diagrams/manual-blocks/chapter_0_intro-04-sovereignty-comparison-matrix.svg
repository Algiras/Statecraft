<svg xmlns="http://www.w3.org/2000/svg" width="900" height="524" viewBox="0 0 900 524" role="img" aria-labelledby="title desc">
  <title id="title">SOVEREIGNTY COMPARISON MATRIX</title>
  <desc id="desc">Manual figure generated from a source block in the Statecraft manuscript.</desc>
  <rect width="900" height="524" rx="14" fill="#171821"/>
  <rect x="1" y="1" width="898" height="522" rx="13" fill="none" stroke="#32354a"/>
  <text x="32" y="30" class="label">STATECRAFT MANUAL FIGURE</text>
  <text x="32" y="54" class="line">+-----------------------------------------------------------------------+</text>
  <text x="32" y="76" class="line">|                 SOVEREIGNTY COMPARISON MATRIX                         |</text>
  <text x="32" y="98" class="line">+----------------------+----------------------+-------------------------+</text>
  <text x="32" y="120" class="line">| Feature              | De Facto Sovereignty | De Jure Sovereignty     |</text>
  <text x="32" y="142" class="line">+----------------------+----------------------+-------------------------+</text>
  <text x="32" y="164" class="line">| Definition           | Control in physical  | Recognition in law      |</text>
  <text x="32" y="186" class="line">|                      | reality              |                         |</text>
  <text x="32" y="208" class="line">+----------------------+----------------------+-------------------------+</text>
  <text x="32" y="230" class="line">| Source of Authority  | Military control,    | UN membership, treaties,|</text>
  <text x="32" y="252" class="line">|                      | police, tax systems  | diplomatic recognition  |</text>
  <text x="32" y="274" class="line">+----------------------+----------------------+-------------------------+</text>
  <text x="32" y="296" class="line">| Vulnerability        | High risk of military| High stability; borders |</text>
  <text x="32" y="318" class="line">|                      | invasion or collapse | legally protected       |</text>
  <text x="32" y="340" class="line">+----------------------+----------------------+-------------------------+</text>
  <text x="32" y="362" class="line">| Example: Taiwan      | High (Full control   | Low (Only 12 states     |</text>
  <text x="32" y="384" class="line">|                      | on the ground)       | recognize officially)   |</text>
  <text x="32" y="406" class="line">+----------------------+----------------------+-------------------------+</text>
  <text x="32" y="428" class="line">| Example: Order of    | Low (No territory or | High (Recognized by 113 |</text>
  <text x="32" y="450" class="line">| Malta                | physical population) | states; UN observer)    |</text>
  <text x="32" y="472" class="line">+----------------------+----------------------+-------------------------+</text>
