<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">Sovereign Cloud State X-Road architecture</title>
<desc id="desc">Three agencies exchange encrypted data through peer security servers while using a central registry only for directory and certificate lookup.</desc>
<rect width="1280" height="760" fill="#151620"/>
<rect x="40" y="42" width="1200" height="676" rx="18" fill="#1b1c27" stroke="#34384f"/>
<text x="80" y="88" class="eyebrow">SOVEREIGN STATE NETWORK</text>
<text x="80" y="132" class="title">Decentralized Data Exchange Architecture</text>
<g class="agency">
  <rect x="92" y="198" width="310" height="210" rx="14"/>
  <text x="122" y="238" class="agency-title">Agency A</text>
  <text x="122" y="266" class="muted">Population Registry</text>
  <rect x="132" y="300" width="120" height="54" rx="10" class="db"/><text x="162" y="333" class="node">DB</text>
  <rect x="268" y="292" width="100" height="70" rx="10" class="server"/><text x="285" y="323" class="node">Security</text><text x="302" y="346" class="node">Server</text>
</g>
<g class="agency">
  <rect x="485" y="198" width="310" height="210" rx="14"/>
  <text x="515" y="238" class="agency-title">Agency B</text>
  <text x="515" y="266" class="muted">Tax Authority</text>
  <rect x="525" y="300" width="120" height="54" rx="10" class="db"/><text x="555" y="333" class="node">DB</text>
  <rect x="661" y="292" width="100" height="70" rx="10" class="server"/><text x="678" y="323" class="node">Security</text><text x="695" y="346" class="node">Server</text>
</g>
<g class="agency">
  <rect x="878" y="198" width="310" height="210" rx="14"/>
  <text x="908" y="238" class="agency-title">Agency C</text>
  <text x="908" y="266" class="muted">Health Board</text>
  <rect x="918" y="300" width="120" height="54" rx="10" class="db"/><text x="948" y="333" class="node">DB</text>
  <rect x="1054" y="292" width="100" height="70" rx="10" class="server"/><text x="1071" y="323" class="node">Security</text><text x="1088" y="346" class="node">Server</text>
</g>
<rect x="470" y="526" width="340" height="86" rx="16" fill="#25243a" stroke="#6f63ff"/>
<text x="520" y="561" class="central">Central Registry</text><text x="518" y="590" class="muted">Directory service + certificates</text>
<path d="M368 327 C455 292 555 292 661 327" class="link"/><path d="M761 327 C858 292 962 292 1054 327" class="link"/><path d="M368 348 C528 460 878 460 1054 348" class="link"/>
<path d="M318 362 L548 526" class="dash"/><path d="M711 362 L670 526" class="dash"/><path d="M1104 362 L744 526" class="dash"/>
<text x="468" y="292" class="small">Encrypted TLS 1.3 / X-Road tunnels</text>
<text x="820" y="520" class="small">directory + certificate fetch</text>
<style>
.title{font:700 34px ui-sans-serif,system-ui;fill:#f4f4f7}.eyebrow{font:700 13px ui-sans-serif,system-ui;letter-spacing:2.5px;fill:#8b7cff}.agency rect:first-child{fill:#20222e;stroke:#3a3e55}.agency-title{font:700 24px ui-sans-serif,system-ui;fill:#fff}.muted{font:16px ui-sans-serif,system-ui;fill:#a4a6bd}.db{fill:#253247;stroke:#4a79b9}.server{fill:#2c2947;stroke:#8072ff}.node{font:700 16px ui-sans-serif,system-ui;fill:#f4f4f7}.central{font:700 25px ui-sans-serif,system-ui;fill:#fff}.small{font:15px ui-sans-serif,system-ui;fill:#c6c7d7}.link{fill:none;stroke:#4fb1d3;stroke-width:4;marker-end:url(#arrow)}.dash{fill:none;stroke:#8b7cff;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#arrow)}
</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8b7cff"/></marker></defs></svg>
