name: Release — PDF, EPUB & Markdown Book

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run book QA
        run: python3 scripts/qa_book.py

      - name: Install Pandoc & XeLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-fonts-extra fonts-dejavu

      - name: Merge chapters into book.md
        run: python merge_chapters.py

      - name: Compile PDF
        run: bash compile_pdf.sh

      - name: Compile EPUB
        run: bash compile_epub.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Statecraft ${{ github.ref_name }}"
          body: |
            ## Statecraft: A How-To Guide for the Accidental Founder

            Download the full book in your preferred format:

            - 📄 **statecraft_manual.pdf** — Typeset PDF (print-ready)
            - 📚 **statecraft.epub** — E-reader edition (Kindle, Apple Books, etc.)
            - 📖 **book.md** — Full Markdown manuscript (67,600+ words)

            Support future editions and audiobook production at https://buymeacoffee.com/algiras.
          files: |
            statecraft_manual.pdf
            statecraft.epub
            book.md
